name: keepalive

# GitHub silently disables scheduled workflows in a repo with no commit activity
# for 60 days. This empty monthly commit resets that clock so the uptime monitor
# never dies quietly.

on:
  schedule:
    - cron: "17 8 1 * *"
  workflow_dispatch:

# No token scopes by default; the one job below asks only for what it uses.
permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # contents: write is needed to push the empty keepalive commit, and only here.
    permissions:
      contents: write
    steps:
      # Credentials stay persisted on purpose: the push step below uses them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Empty keepalive commit
        run: |
          git config user.name "jet-uptime-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: reset the 60-day scheduled-workflow clock"
          git push
